services:
  # Opsional prod: Traefik hanya jika butuh Host(inventory.localhost).
  # Dev ringan cukup http://localhost:8000 → jalankan: docker compose up pencatatan worker postgres
  traefik:
    image: traefik:v3.1
    profiles: ["prod"]
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - inventory

  # Alternatif lokal untuk test case saja (tidak default). Aktifkan via: docker compose --profile local-db up
  # Default tetap Neon (online) — lihat .env.example DB_URL
  postgres:
    image: postgres:16-alpine
    profiles: ["local-db"]
    environment:
      POSTGRES_DB: ${DB_DATABASE:-inventory}
      POSTGRES_USER: ${DB_USERNAME:-inventory}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - inventory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-inventory} -d ${DB_DATABASE:-inventory}"]
      interval: 5s
      timeout: 3s
      retries: 10

  pencatatan:
    build: .
    env_file: .env
    environment:
      PHP_CLI_SERVER_WORKERS: 4
    command: sh -c "php artisan config:cache --quiet || true; php artisan route:cache --quiet || true; php artisan view:cache --quiet || true; php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "8000:8000"
    volumes:
      - inventory-storage:/var/www/html/storage
    labels:
      - traefik.enable=true
      - traefik.http.routers.inventory.rule=Host(`inventory.localhost`) || Host(`localhost`)
      - traefik.http.routers.inventory.entrypoints=web
      - traefik.http.services.inventory.loadbalancer.server.port=8000
    networks:
      - inventory

  # Single worker untuk semua queue (reports + notifications) — lebih ringan dari 2 container terpisah
  worker:
    build: .
    env_file: .env
    command: php artisan queue:work --queue=reports,notifications,default --sleep=2 --tries=3 --timeout=120
    volumes:
      - inventory-storage:/var/www/html/storage
    depends_on:
      pencatatan:
        condition: service_started
    networks:
      - inventory

  # Backward compat: layanan lama tetap ada tapi jadi profile prod/legacy agar tidak jalan default
  cetak-laporan:
    build: .
    profiles: ["legacy"]
    env_file: .env
    command: php artisan queue:work --queue=reports --sleep=2 --tries=3 --timeout=120
    volumes:
      - inventory-storage:/var/www/html/storage
    depends_on:
      - pencatatan
    networks:
      - inventory

  notif-komunikasi:
    build: .
    profiles: ["legacy"]
    env_file: .env
    command: php artisan queue:work --queue=notifications --sleep=2 --tries=3 --timeout=90
    volumes:
      - inventory-storage:/var/www/html/storage
    depends_on:
      - pencatatan
    networks:
      - inventory

networks:
  inventory:
    driver: bridge

volumes:
  inventory-storage:
  pgdata:
