; OPcache ringan untuk pencatatan — Keep All
; Dev: validate_timestamps=1 agar tidak perlu rebuild tiap edit
; Prod: set OP_ENV=production untuk validate_timestamps=0 via env
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.jit=disable
opcache.save_comments=1
